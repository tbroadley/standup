[project]
name = "standup"
version = "0.1.0"
description = "Generate standup markdown from the status-dashboard task store"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "status-dashboard @ git+https://github.com/tbroadley/status-dashboard.git",
]

[project.scripts]
standup = "standup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
